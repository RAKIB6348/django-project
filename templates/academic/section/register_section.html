<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Section</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px 12px;
    }

    .card {
      width: min(420px, 96vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type=text] {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      background: #fff;
    }

    input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Register Section</h1>
    <p>Give the section a short, unique name (e.g. A, B, C) so it can be assigned to classes.</p>
    <form action="{% url 'add_section' %}" method="post">
      {% csrf_token %}
      <label for="section_name">Section Name</label>
      <input
        type="text"
        id="section_name"
        name="section_name"
        placeholder="Enter section name"
        maxlength="10"
        required
      >
      <button type="submit">Save Section</button>
    </form>
  </section>
</body>
</html>
