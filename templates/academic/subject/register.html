<!DOCTYPE html>
<html>
<style>
form {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

label {display: block;}

input[type=text], select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}
</style>
<body>

<center><h2>Add Academic Subject</h2></center>
<form action="#">
  <label for="subject_name">Subject Name</label>
  <input type="text" id="subject_name" name="subject_name"  placeholder="Example: Mathematics, Science" required>

  <label for="subject_code">Subject Code</label>
  <input type="text" id="subject_code" name="subject_code" placeholder="Example: MTH101, SCI102" required>

  
  <input type="submit" value="Submit">
</form>

</body>
</html>
