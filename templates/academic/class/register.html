<!DOCTYPE html>
<html>
<style>
form {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

label {display: block; font-weight: bold;}

input[type=text], select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.help-text {
  font-size: 12px;
  color: #888;
  margin-top: -10px;
  margin-bottom: 10px;
}
</style>
<body>

<center><h2>Register Class</h2></center>

<form action="{% url 'add_class' %}" method="post">
  <label for="class_name">Class Name</label>
  <input type="text" id="class_name" name="class_name" placeholder="e.g. 10th Grade.." required>

  <label for="class_code" title="Please enter a 2-digit class code, like 01, 10, etc">Class Code</label>
  <small>Please enter a 2-digit class code, like 01, 10, etc</small>
  <input type="text" id="class_code" name="class_code" placeholder="e.g. 01, 05, 10.." required>
  

  <input type="submit" value="Register Class">
</form>

</body>
</html>
