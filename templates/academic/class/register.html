<!DOCTYPE html>
<html>
<style>
form {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

label {display: block; font-weight: bold;}

input[type=text], select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}
</style>
<body>

<center><h2>Register Class</h2></center>
<form action="/action_page.php">
  <label for="class_name">Class Name</label>
  <input type="text" id="class_name" name="class_name" placeholder="Class name..">

  <label for="class_code">Class Name</label>
  <input type="text" id="class_code" name="class_code" placeholder="e.g. 01, 05, 10..">

  
  <input type="submit" value="Register Class">
</form>

</body>
</html>
