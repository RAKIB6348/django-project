<!DOCTYPE html>
<html>
<head>
<style>
table {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #ddd;
  padding: 8px;
}

tr:nth-child(even){background-color: #f2f2f2;}

tr:hover {background-color: #ddd;}

th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: center;
  background-color: #04AA6D;
  color: white;
}
</style>
</head>
<body>

<center><h2>Class List Table</h2></center>
<table>
  <tr>
    <th>ID</th>
    <th>Class Name</th>
    <th>Class Code</th>
    <th>Created At</th>
  </tr>

  {% for c in class_data %}
  <tr>
    <td>{{forloop.counter}}</td>
    <td>{{c.class_name}}</td>
    <td>{{c.class_code}}</td>
    <td>{{c.created_at}}</td>
  </tr>
  
  {% endfor %}
  
</table>

</body>
</html>
