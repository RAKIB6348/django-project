<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* (same CSS you wrote — unchanged) */
.form-box {
  max-width: 1000px;
  margin: 40px auto;
  padding: 25px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
.header-box {
  background: #04AA6D;
  padding: 22px;
  border-radius: 10px;
  margin-bottom: 25px;
  text-align: center;
  color: white;
}
.input-group-custom {
  background-color: #f2f2f2;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 20px;
}
label { font-weight: 600; margin-bottom: 5px; }
input[type=text], input[type=email], input[type=file], select {
  width: 100%; padding: 12px; margin-top: 6px;
  border: 1px solid #ccc; border-radius: 6px; height: 48px;
}
.btn-submit {
  width: 100%; padding: 14px;
  border: none; background: #2563eb; color: white;
  font-size: 16px; border-radius: 6px;
}
.btn-generate {
  width: 100%; padding: 14px;
  background: #facc15; border: 1px solid #eab308;
  border-radius: 6px; font-weight: 600;
}
</style>
</head>

<body style="background:#f5f5f7; padding:30px;">

<div class="form-box">

  <div class="header-box">
    <div class="form-title"><h4>Admin Registration</h4></div>
    <div class="form-subtitle">Fill in the details to create an admin account.</div>
  </div>

  <!-- IMPORTANT: method + enctype + csrf -->
  <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

    <div class="row">

      <!-- Profile Picture -->
      <div class="col-md-12">
        <div class="input-group-custom">
          <label>Profile Picture</label>
          <input type="file" name="profile_pic" accept="image/*">
        </div>
      </div>

      <!-- Username -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Username <span class="required-star">*</span></label>
          <input type="text" name="username" placeholder="Username" required>
        </div>
      </div>

      <!-- Phone -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Phone Number <span class="required-star">*</span></label>
          <input type="text" name="phone" placeholder="01XXXXXXXXX" required>
        </div>
      </div>

      <!-- First Name -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>First Name <span class="required-star">*</span></label>
          <input type="text" name="first_name" placeholder="First name" required>
        </div>
      </div>

      <!-- Last Name -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Last Name <span class="required-star">*</span></label>
          <input type="text" name="last_name" placeholder="Last name" required>
        </div>
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Email <span class="required-star">*</span></label>
          <input type="email" name="email" placeholder="email@example.com" required>
        </div>
      </div>

      <!-- Gender -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Gender <span class="required-star">*</span></label>
          <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <!-- Country -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Country</label>
          <input type="text" name="country" value="Bangladesh">
        </div>
      </div>

      <!-- City -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>City</label>
          <input type="text" name="city" placeholder="City">
        </div>
      </div>

      <!-- State (OPTIONAL – model e nai) -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>State</label>
          <input type="text" name="state" placeholder="State">
        </div>
      </div>

      <!-- ZIP -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>ZIP</label>
          <input type="text" name="zip_code" placeholder="ZIP">
        </div>
      </div>

      <!-- Password -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Password <span class="required-star">*</span></label>
          <input type="text" name="password" id="passwordBox" placeholder="Auto-generated" required>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="col-md-6">
        <div class="input-group-custom">
          <label>Confirm Password <span class="required-star">*</span></label>
          <input type="text" name="confirm_password" id="confirmBox" placeholder="Repeat password" required>
        </div>
      </div>

    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <button type="button" class="btn-generate" onclick="generatePass()">Generate Password</button>
      </div>
      <div class="col-md-6">
        <button type="submit" class="btn-submit">Register Admin</button>
      </div>
    </div>

  </form>

</div>

<script>
function generatePass() {
    const length = 6;
    let pass = "";
    for (let i = 0; i < length; i++) {
        pass += Math.floor(Math.random() * 10);
    }
    document.getElementById("passwordBox").value = pass;
    document.getElementById("confirmBox").value = pass;
}
</script>

</body>
</html>
